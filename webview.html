<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In-App Browser Detection</title>
<style>
body {
font-family: sans-serif;
margin: 2rem;
}
code Code

    
.modal-overlay {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 500px;
        text-align: center;
        border-radius: 8px;
    }

    .modal-content h2 {
        margin-top: 0;
    }

    .modal-content p {
        margin-bottom: 20px;
    }

    .close-button {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
</style>

  

</head>
<body>
    
<h1>Welcome to My Website</h1>
<p>This page demonstrates how to detect if it's being viewed within a social media app's internal browser and prompt the user to open it in their default browser.</p>

<div id="inAppBrowserModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Open in your Browser</h2>
        <p>For the best experience, please open this link in your device's default browser.</p>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const modal = document.getElementById("inAppBrowserModal");
        const closeButton = document.getElementsByClassName("close-button");
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;

        function isFacebookApp() {
            return (userAgent.indexOf("FBAN") > -1) || (userAgent.indexOf("FBAV") > -1);
        }

        function isInstagramApp() {
            return (userAgent.indexOf("Instagram") > -1);
        }

        function isOtherInAppBrowser() {
            return (
                /inapp|webview/i.test(userAgent) ||
                /FB_IAB|FB4A|FBAN/i.test(userAgent) ||
                /Instagram|Twitter|LinkedIn|Snapchat/i.test(userAgent)
            );
        }

        if (isFacebookApp() || isInstagramApp() || isOtherInAppBrowser()) {
            modal.style.display = "block";
        }

        closeButton.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    });
</script>

  

</body>
</html>
